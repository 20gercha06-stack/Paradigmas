<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Hospital</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004494; }
        #mensaje { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Agendar Nueva Cita</h2>
    <form id="formCita">
        <div class="form-group">
            <label for="pacienteID">ID del Paciente:</label>
            <input type="number" id="pacienteID" required>
        </div>
        <div class="form-group">
            <label for="doctorID">ID del Doctor:</label>
            <input type="number" id="doctorID" required>
        </div>
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
            <label for="hora">Hora de inicio:</label>
            <input type="time" id="hora" required>
        </div>
        <button type="submit">Generar Cita</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>
    document.getElementById('formCita').addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita que la página se recargue

        const pacienteID = document.getElementById('pacienteID').value;
        const doctorID = document.getElementById('doctorID').value;
        const fecha = document.getElementById('fecha').value;
        const hora = document.getElementById('hora').value;
        const divMensaje = document.getElementById('mensaje');

        try {
            // Enviar datos al servidor Express
            const respuesta = await fetch('/api/citas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pacienteID, doctorID, fecha, hora })
            });

            const resultado = await respuesta.json();
            divMensaje.style.display = 'block';

            if (respuesta.ok) {
                divMensaje.className = 'exito';
                divMensaje.textContent = resultado.mensaje;
                document.getElementById('formCita').reset();
            } else {
                divMensaje.className = 'error';
                divMensaje.textContent = "Error: " + resultado.error;
            }
        } catch (error) {
            divMensaje.style.display = 'block';
            divMensaje.className = 'error';
            divMensaje.textContent = "Error al conectar con el servidor.";
        }
    });
</script>

</body>
</html>
